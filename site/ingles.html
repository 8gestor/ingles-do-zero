<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="assets/fonts/fonts.css">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/narracao.css">
    <link rel="stylesheet" href="assets/css/capitulos/ingles.css">
    <link rel="stylesheet" href="assets/css/papel.css">
</head>
<body>

    <main class="lab" id="lab">
        <span class="meta-tag" id="lb-meta"></span>

        <!-- BIBLIOTECA: cinco seções, escolhidas pelo menu lateral do site -->
        <section id="lb-library">
            <h1 id="lb-title"></h1>
            <p class="lb-lead" id="lb-lead"></p>

            <!-- 1. BIBLIOTECA -->
            <div class="lb-pane" id="lb-pane-lib">
                <div id="lb-a-week"></div>
                <h2 id="lb-h-docs"></h2>
                <div class="lb-tools" id="lb-tools" hidden>
                    <input type="search" id="lb-search" class="lb-input" autocomplete="off">
                    <select id="lb-sort" class="lb-input"></select>
                </div>
                <div class="lb-docs" id="lb-docs" aria-live="polite"></div>
                <p class="lb-note" id="lb-storage"></p>
            </div>

            <!-- 2. LEITOR / SUBIR PDF -->
            <div class="lb-pane" id="lb-pane-up" hidden>
                <p class="lb-intro" id="lb-intro"></p>
                <div class="lb-drop" id="lb-drop" tabindex="0" role="button" aria-label="Enviar documento">
                    <strong id="lb-drop-main"></strong>
                    <span id="lb-drop-sub"></span>
                    <input type="file" id="lb-file" accept=".pdf,application/pdf,.txt,text/plain" hidden>
                </div>
                <div class="lb-progress" id="lb-progress" hidden>
                    <div class="lb-progress-text" id="lb-progress-text"></div>
                    <div class="lb-bar"><div class="lb-bar-fill" id="lb-progress-fill"></div></div>
                </div>
                <p class="lb-error" id="lb-error" role="alert" hidden></p>
            </div>

            <!-- 3. SEU PROGRESSO -->
            <div class="lb-pane" id="lb-pane-prog" hidden>
                <div id="lb-a-sess"></div>
                <div id="lb-a-prog"></div>
            </div>

            <!-- 4. VOCABULÁRIO -->
            <div class="lb-pane" id="lb-pane-vocab" hidden>
                <div id="lb-a-vocab"></div>
            </div>

            <!-- 5. CONFIGURAÇÕES (o que não está no menu superior) -->
            <div class="lb-pane" id="lb-pane-cfg" hidden>
                <h2 id="lb-h-engine"></h2>
                <div class="lb-engine" id="lb-engine" aria-live="polite"></div>
                <h2 id="lb-h-voice"></h2>
                <div class="lb-engine" id="lb-voice" aria-live="polite"></div>
                <p class="lb-note" id="lb-note"></p>
            </div>
        </section>
        <!-- LEITOR DO DOCUMENTO -->
        <section id="lb-reader" hidden>
            <div class="lb-toolbar">
                <button type="button" class="lb-btn" id="lb-back"></button>
                <div class="lb-study" id="lb-study" role="group">
                    <span class="lb-study-label" id="lb-study-label"></span>
                    <button type="button" class="lb-btn" id="lb-translate-all"></button>
                </div>
                <span class="lb-status" id="lb-status" aria-live="polite"></span>
            </div>
            <div class="lb-banner" id="lb-banner" role="alert" hidden>
                <span id="lb-banner-text"></span>
                <button type="button" class="lb-btn" id="lb-banner-btn" hidden></button>
            </div>
            <h1 id="lb-doc-title"></h1>
            <p class="lb-doc-meta" id="lb-doc-meta"></p>
            <div class="lb-wrap" id="lb-wrap">
                <div class="lb-band" id="lb-band" aria-hidden="true"></div>
                <article id="lb-text"></article>
            </div>
        </section>
    </main>

    <script type="importmap">{"imports":{"onnxruntime-web":"./assets/vendor/piper/ort.min.js"}}</script>
    <script src="assets/js/ingles.js"></script>
    <script src="assets/js/ingles-palavras.js"></script>
    <script src="assets/js/ingles-nivel.js"></script>
    <script src="assets/js/ingles-treino.js"></script>
    <script src="assets/js/ingles-compreensao.js"></script>
    <script src="assets/js/ingles-progresso.js"></script>
    <script src="assets/js/ingles-semana.js"></script>
    <script src="assets/js/ingles-dia.js"></script>
    <script src="assets/js/ingles-modos.js"></script>
    <script src="assets/js/ingles-alinhar.js"></script>
    <script src="assets/js/ingles-explorar.js"></script>
    <script src="assets/js/ingles-teleprompter.js"></script>
    <script src="assets/js/ingles-legenda.js"></script>
    <script src="assets/js/ingles-destaque.js"></script>
    <script src="assets/js/ingles-importar.js"></script>
    <script src="assets/js/sync-config.js"></script>
    <script src="assets/js/ingles-sync.js"></script>
    <script src="assets/js/ingles-voz.js"></script>
    <script src="assets/js/ingles-abas.js"></script>
</body>
</html>
